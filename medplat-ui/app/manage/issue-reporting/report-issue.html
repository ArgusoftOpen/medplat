<div class="row">
    <div class="col-md-12">
        <div class="card p-4">
            <h3 class="mb-4">Report an Issue</h3>

            <!-- Progress Stepper -->
            <div class="reporting-stepper mb-4">
                <div class="step" ng-class="{'active': ctrl.step >= 1, 'completed': ctrl.step > 1}">
                    <span class="step-num">1</span>
                    <span class="step-text">Type</span>
                </div>
                <div class="line"></div>
                <div class="step" ng-class="{'active': ctrl.step >= 2, 'completed': ctrl.step > 2}">
                    <span class="step-num">2</span>
                    <span class="step-text">Details</span>
                </div>
                <div class="line"></div>
                <div class="step" ng-class="{'active': ctrl.step >= 3, 'completed': ctrl.step > 3}">
                    <span class="step-num">3</span>
                    <span class="step-text">Review</span>
                </div>
            </div>

            <form name="issueForm" novalidate>
                <!-- Step 1: Issue Type -->
                <div ng-show="ctrl.step === 1">
                    <h4>What kind of issue are you facing?</h4>
                    <div class="row mt-3">
                        <div class="col-md-4" ng-repeat="type in ctrl.issueTypes">
                            <div class="issue-type-card" ng-class="{'selected': ctrl.issue.type === type.id}"
                                ng-click="ctrl.selectType(type.id)">
                                <i class="fa" ng-class="type.icon"></i>
                                <h5>{{type.name}}</h5>
                                <p>{{type.desc}}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Issue Details -->
                <div ng-show="ctrl.step === 2">
                    <h4>Tell us more</h4>
                    <div class="form-group mt-3">
                        <label>Title</label>
                        <input type="text" class="form-control" ng-model="ctrl.issue.title" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea class="form-control" rows="5" ng-model="ctrl.issue.description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Attachments (Optional)</label>
                        <input type="file" class="form-control-file">
                    </div>
                </div>

                <!-- Step 3: Review -->
                <div ng-show="ctrl.step === 3">
                    <h4>Review your report</h4>
                    <div class="review-box mt-3">
                        <p><strong>Type:</strong> {{ctrl.getIssueTypeName()}}</p>
                        <p><strong>Title:</strong> {{ctrl.issue.title}}</p>
                        <p><strong>Description:</strong> {{ctrl.issue.description}}</p>
                    </div>
                </div>

                <div class="mt-4">
                    <button class="btn btn-secondary" ng-show="ctrl.step > 1"
                        ng-click="ctrl.prevStep()">Previous</button>
                    <button class="btn btn-primary float-right" ng-show="ctrl.step < 3" ng-click="ctrl.nextStep()"
                        ng-disabled="ctrl.step === 1 && !ctrl.issue.type">Next</button>
                    <button class="btn btn-success float-right" ng-show="ctrl.step === 3"
                        ng-click="ctrl.submit()">Submit Ticket</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .reporting-stepper {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0.5;
    }

    .step.active {
        opacity: 1;
        font-weight: bold;
    }

    .step.completed .step-num {
        background: #28a745;
        border-color: #28a745;
        color: white;
    }

    .step-num {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid #007bff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 5px;
    }

    .line {
        flex: 0.2;
        height: 2px;
        background: #ddd;
        margin: 0 10px;
        margin-top: -20px;
    }

    .issue-type-card {
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
        height: 100%;
    }

    .issue-type-card:hover {
        border-color: #007bff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .issue-type-card.selected {
        border-color: #007bff;
        background: #e7f1ff;
    }

    .issue-type-card i {
        font-size: 2rem;
        color: #007bff;
        margin-bottom: 10px;
    }

    .review-box {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 5px;
        border: 1px dashed #ccc;
    }
</style>
