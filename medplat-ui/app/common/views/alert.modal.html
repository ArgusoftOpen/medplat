<!-- alert.modal.html -->

<div class="modal-header"> 
    <h4 class="text">
        {{title || ('CONFIRM_ACTION' | translate)}}
    </h4>
</div>

<div class="modal-body" ng-bind-html="message">
</div>

<div class="modal-footer">
    <button class="btn btn-primary" ng-click="ok()">
        {{ 'OK' | translate }}
    </button>
</div>
