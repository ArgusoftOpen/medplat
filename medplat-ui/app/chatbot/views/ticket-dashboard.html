<div class="ticket-dashboard container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><em class="fa fa-ticket"></em> Support Tickets</h2>
        <button class="btn btn-primary" ui-sref="techo.chatbot">New Ticket</button>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label>Status</label>
                    <select class="form-control" ng-model="ticketDash.filter.status"
                        ng-change="ticketDash.loadTickets()">
                        <option value="ALL">All Statuses</option>
                        <option value="OPEN">Open</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="CLOSED">Closed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Priority</label>
                    <select class="form-control" ng-model="ticketDash.filter.priority"
                        ng-change="ticketDash.loadTickets()">
                        <option value="ALL">All Priorities</option>
                        <option value="HIGH">High</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="LOW">Low</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover bg-white border">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="ticket in ticketDash.tickets">
                    <td><strong>{{ticket.id}}</strong></td>
                    <td>{{ticket.title}}</td>
                    <td><span class="badge {{ticketDash.getStatusClass(ticket.status)}}">{{ticket.status}}</span></td>
                    <td>{{ticket.priority}}</td>
                    <td>{{ticket.createdAt | date:'dd/MM/yyyy'}}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary"><em class="fa fa-eye"></em></button>
                    </td>
                </tr>
                <tr ng-if="ticketDash.tickets.length === 0 && !ticketDash.loading">
                    <td colspan="6" class="text-center">No tickets found.</td>
                </tr>
                <tr ng-if="ticketDash.loading">
                    <td colspan="6" class="text-center italic">Loading tickets...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
